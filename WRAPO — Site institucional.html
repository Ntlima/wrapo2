  <circle cx="100" cy="300" r="6" fill="#A18BFF" class="nd"/><circle cx="200" cy="200" r="6" fill="#EEF0F8" class="nd" style="animation-delay:1s"/><circle cx="300" cy="100" r="6" fill="#35C6D9" class="nd" style="animation-delay:2s"/>
 </svg></div></section>
<section id="sobre"><div class="w about rv"><h2>${t.about.h}</h2><p>${t.about.p}</p></div></section>
<section id="solucoes" style="padding-top:0"><div class="w"><div class="rv"><span class="eyebrow">${t.sv.k}</span><h2 class="t">${t.sv.h}</h2></div>
 ${t.sv.fr.map((f,i)=>`<div class="front rv"><header><span class="n">0${i+1}</span><h3>${f[0]}</h3></header><div class="grid">
 ${f[1].map(s=>`<article class="card"><h4>${s.n}</h4><p>${s.d}</p><ul>${s.l.map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn sm" href="#contato" data-sv="${esc(s.n)}">${t.sv.cta}</a></article>`).join("")}</div></div>`).join("")}</div></section>
<section id="metodo" class="dark"><div class="w"><div class="rv"><span class="eyebrow">${t.me.k}</span><h2 class="t">${t.me.h}</h2></div>
 <div class="steps rv">${t.me.st.map((s,i)=>`<div class="step"><b>0${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div></div></section>
<section id="projetos"><div class="w"><div class="rv"><span class="eyebrow">${t.pj.k}</span><h2 class="t" style="margin-bottom:12px">${t.pj.h}</h2><p style="color:var(--muted);margin:0 0 32px">${t.pj.note}</p></div>
 <div class="grid">${t.pj.it.map(p=>`<article class="proj rv"><span class="tag">${t.pj.tag}</span><h4 style="font:700 1.2rem var(--font-h);margin:0">${p.n}</h4><span class="eyebrow">${p.c}</span><dl><dt>${t.pj.lb[0]}</dt><dd>${p.a}</dd><dt>${t.pj.lb[1]}</dt><dd>${p.b}</dd><dt>${t.pj.lb[2]}</dt><dd>${p.t}</dd></dl></article>`).join("")}</div></div></section>
<section style="padding-top:0"><div class="w"><div class="rv"><span class="eyebrow">${t.di.k}</span><h2 class="t">${t.di.h}</h2></div><ul class="diff rv">${t.di.li.map(x=>`<li>${x}</li>`).join("")}</ul></div></section>
<section class="dark cta"><div class="w rv"><h2>${t.fc.h}</h2><p>${t.fc.p}</p><a class="btn" href="#contato">${t.cta}</a></div></section>
<section id="contato"><div class="w cwrap"><div class="rv"><span class="eyebrow">${t.ct.k}</span><h2 class="t" style="margin-bottom:24px">${t.ct.h}</h2>
 <div class="chan"><b>${t.ct.ch}</b><a href="mailto:${c.email}">${c.email}</a><a href="${ig}" target="_blank" rel="noopener">${c.instagramHandle}</a>${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div></div>
 <form id="f" novalidate class="rv">
  <div><label for="fn">${t.ct.f.n}</label><input id="fn" name="n" autocomplete="name" required><div class="err" id="en"></div></div>
  <div><label for="fe">${t.ct.f.e}</label><input id="fe" name="e" type="email" autocomplete="email" required><div class="err" id="ee"></div></div>
  <div><label for="fc">${t.ct.f.c}</label><input id="fc" name="c" autocomplete="organization"></div>
  <div><label for="fs">${t.ct.f.s}</label><select id="fs" name="s" required><option value="">${t.ct.f.pick}</option>${svc.map(s=>`<option>${s.n}</option>`).join("")}<option>${t.ct.f.other}</option></select><div class="err" id="es"></div></div>
  <div><label for="fm">${t.ct.f.m}</label><textarea id="fm" name="m" rows="5" required></textarea><div class="err" id="em"></div></div>
  <div class="hp" aria-hidden="true"><label>Website<input id="hp" tabindex="-1" autocomplete="off"></label></div>
  <button class="btn" type="submit">${t.ct.send}</button><div id="st" role="status" aria-live="polite"></div>
 </form></div></section>`;
 $("#ft").innerHTML=`<div class="w"><div><a class="logo" href="#top">WRAPO<i>.</i></a><p style="color:#b9bad0;max-width:320px">${t.ft.d}</p></div>
 <div><h5>${t.ft.n}</h5>${t.nav.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("")}</div>
 <div><h5>${t.ft.s}</h5>${t.sv.fr.map(f=>`<a href="#solucoes">${f[0]}</a>`).join("")}</div>
 <div><h5>${t.ft.c}</h5><a href="mailto:${c.email}">${c.email}</a><a href="${ig}" target="_blank" rel="noopener">${c.instagramHandle}</a>${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>
 <div class="copy">© ${new Date().getFullYear()} WRAPO. ${t.ft.r}</div></div>`;
 bind();
}
function bind(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
 document.querySelectorAll(".rv").forEach(e=>io.observe(e));
 document.querySelectorAll("[data-sv]").forEach(a=>a.addEventListener("click",()=>{$("#fs").value=a.dataset.sv}));
 $("#f").addEventListener("submit",submit);
}
async function submit(ev){
 ev.preventDefault();const t=T[L].ct,f=ev.target,st=$("#st");
 const v={n:f.n.value.trim(),e:f.e.value.trim(),c:f.c.value.trim(),s:f.s.value,m:f.m.value.trim()};
 const bad={n:!v.n,e:!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.e),s:!v.s,m:v.m.length<10};
 for(const k of["n","e","s","m"]){$("#e"+k).textContent=bad[k]?t.er[k]:"";f[k].setAttribute("aria-invalid",bad[k])}
 const first=["n","e","s","m"].find(k=>bad[k]);if(first){f[first].focus();return}
 if($("#hp").value)return; // honeypot anti-spam
 st.className="";st.textContent="…";
 if(contactConfig.formEndpoint){
  try{const r=await fetch(contactConfig.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({name:v.n,email:v.e,company:v.c,service:v.s,message:v.m,lang:L})});
   if(!r.ok)throw 0;st.className="ok";st.textContent=t.ok;f.reset()}catch(e){st.className="bad";st.textContent=t.bad}
 }else{ // sem backend configurado: abre o e-mail do visitante com a mensagem pronta
  const body=`${v.m}\n\n— ${v.n}${v.c?" ("+v.c+")":""}\n${v.e}`;
  location.href=`mailto:${contactConfig.email}?subject=${encodeURIComponent("WRAPO — "+v.s)}&body=${encodeURIComponent(body)}`;
  st.className="ok";st.textContent=t.mail}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;try{localStorage.setItem("wrapo-lang",L)}catch(e){}render()}));
$("#mb").addEventListener("click",()=>{const o=$("#nv").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)});
$("#nv").addEventListener("click",e=>{if(e.target.tagName==="A"){$("#nv").classList.remove("open");$("#mb").setAttribute("aria-expanded",false)}});
render();
</script>
<footer class="dark" id="ft"></footer>
</body>
</html>
